<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin | Geopram</title><link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E30613; --red-d:#A8000B; --red-l:#FF3B46;
  --ink:#11151B; --ink-2:#1B2129; --ink-3:#2A313B;
  --slate:#5A6270; --mist:#F2F3F5; --line:#E1E4E8; --white:#fff;
  --cut:clamp(14px,2.2vw,26px);
  --dcut:clamp(28px,5vw,72px);
  --wrap:1200px;
  --display:"Bricolage Grotesque","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --body:"Instrument Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--white);overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.025em;line-height:1.08}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
section[id]{scroll-margin-top:72px}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(20px,5vw,48px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--red-l);outline-offset:3px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;z-index:100}
.skip:focus{top:12px}

/* brand device: the cut corner, taken from the faceted G */
.cut{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.cut-both{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

/* buttons */
.btn{--cut:12px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;font:600 1rem/1 var(--body);text-decoration:none;border:0;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);transition:background .2s,color .2s,transform .2s}
.btn--red{background:var(--red);color:#fff}
.btn--red:hover{background:var(--red-d)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:var(--ink-3)}
.btn--line{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn--line:hover{background:rgba(127,127,127,.14)}
.btn--white{background:#fff;color:var(--red-d)}
.btn--white:hover{background:var(--ink);color:#fff}
.btn:focus-visible{clip-path:none;outline:3px solid var(--red-l);outline-offset:3px}
.btn:active{transform:translateY(1px)}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.hdr.is-stuck{border-color:var(--line);box-shadow:0 6px 24px rgba(17,21,27,.06)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:72px}
.hdr__logo img{height:40px;width:auto}
.nav{display:flex;align-items:center;gap:clamp(14px,2vw,30px)}
.nav a{white-space:nowrap;text-decoration:none;font-weight:500;font-size:.97rem;padding:8px 2px;position:relative}
.nav a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.nav a:not(.btn):hover::after{transform:scaleX(1)}
.nav .btn{min-height:44px;padding:0 20px;font-size:.95rem;color:#fff}
.burger{display:none;width:46px;height:46px;border:0;background:var(--ink);cursor:pointer;padding:0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);position:relative}
.burger span,.burger span::before,.burger span::after{display:block;position:absolute;left:13px;width:20px;height:2px;background:#fff;transition:transform .2s,opacity .2s}
.burger span{top:22px}.burger span::before,.burger span::after{content:"";left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.pills button{min-height:42px;padding:0 18px;border:0;background:var(--mist);font:600 .93rem var(--body);cursor:pointer;color:var(--ink)}
.pills button[aria-pressed=true]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.cc{background:var(--mist);display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.cc .im{height:130px;background:var(--ink) url(images/contours.svg) center/cover;position:relative}
.cc .im img{width:100%;height:100%;object-fit:cover}
.cc .tg{position:absolute;left:0;bottom:0;background:var(--red);color:#fff;font:600 .8rem var(--body);padding:5px 12px}
.cc .tg.free{background:var(--ink)}
.cc .bd{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.cc h3{font-size:1.2rem;font-weight:700}.cc p{color:var(--slate);font-size:.95rem}
.cc small{color:var(--slate);font-size:.84rem}
.cc .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.cc .ft b{font:700 1.15rem var(--display)}
.cc .btn{min-height:44px;padding:0 18px;font-size:.92rem}
.bar{height:8px;background:var(--line)}.bar i{display:block;height:100%;background:var(--red)}
dialog{border:0;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(17,21,27,.72)}
.dl{padding:clamp(20px,3vw,32px);display:grid;gap:14px}
.dl h3{font-size:1.5rem}.x{justify-self:end;border:0;background:var(--mist);width:40px;height:40px;cursor:pointer;font-size:1.3rem}
.dl label{font-weight:600;font-size:.9rem;display:block;margin-bottom:5px}
.dl input,.dl select,.dl textarea,.form input,.form select,.form textarea{width:100%;border:2px solid var(--line);padding:12px;font:400 1rem var(--body);min-height:48px;border-radius:0;color:var(--ink);background:#fff}
.dl input:focus{outline:none;border-color:var(--ink)}
.msg{color:var(--red-d);font-weight:600;font-size:.9rem;min-height:1.2em}.mut{color:var(--slate);font-size:.88rem}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
.dtabs button{min-height:46px;padding:0 20px;border:0;background:var(--mist);font:600 .95rem var(--body);cursor:pointer}
.dtabs button[aria-pressed=true]{background:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px}
.stats div{background:var(--ink-2);padding:16px 18px}.stats b{display:block;font:800 2rem var(--display)}.stats span{color:#B7BEC9;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
.lsn{display:grid;gap:6px}.lsn label{display:flex;gap:10px;align-items:center;padding:10px;background:var(--mist);margin:0;font-weight:500}
.lsn input{width:20px;min-height:0;height:20px;accent-color:var(--red)}
.vid{aspect-ratio:16/9;background:var(--ink);color:#B7BEC9;display:grid;place-items:center;text-align:center;padding:16px}.vid iframe{width:100%;height:100%;border:0}
.pf-h{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}.pf-h h3{font-size:1.6rem}.pf-h .btn{margin-left:auto}
.av{flex:none;width:72px;height:72px;background:var(--red);color:#fff;display:grid;place-items:center;font:800 1.6rem var(--display);clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.pf-d,.pf-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:22px 0 0}.pf-d>div{background:var(--mist);padding:14px 16px}.pf-d dt{font-size:.82rem;font-weight:600;color:var(--slate)}.pf-d dd{margin:4px 0 0;font-weight:500;overflow-wrap:anywhere}.pf-d .w,.pf-f .w{grid-column:1/-1}
.pf-f label{font-weight:600;font-size:.9rem;display:block;margin-bottom:5px}.pf-f input,.pf-f select,.pf-f textarea{width:100%;border:2px solid var(--line);padding:12px;font:400 1rem var(--body);min-height:48px;border-radius:0;background:#fff;color:var(--ink)}.pf-f input:focus,.pf-f select:focus,.pf-f textarea:focus{outline:none;border-color:var(--ink)}
.pf-b{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.pf-b .btn{min-width:150px}
.nav a,.nav button.lnk,.nav .btn{white-space:nowrap}
@media(max-width:860px){.dtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;margin-inline:calc(-1*clamp(20px,5vw,48px));padding:0 clamp(20px,5vw,48px) 8px;scroll-snap-type:x proximity}.dtabs button{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}.pf-h .btn{margin-left:0;width:100%}.stats{grid-template-columns:1fr 1fr}.pf-b .btn{flex:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;z-index:200;font-weight:600;max-width:92vw;display:none;border-left:6px solid var(--red)}
[hidden]{display:none!important}
@media(max-width:1020px){.ah .wrap,.contact{grid-template-columns:1fr}}
@media(max-width:1100px){.burger{display:block}.nav{position:absolute;left:0;right:0;top:72px;flex-direction:column;align-items:stretch;gap:0;background:#fff;padding:8px 24px 22px;border-bottom:1px solid var(--line);display:none}.nav.is-open{display:flex}.nav a,.nav button.lnk{padding:14px 0;border-bottom:1px solid var(--line);text-align:left;font-size:1.05rem}.nav .btn{margin-top:14px}}
@media(max-width:640px){.form .two{grid-template-columns:1fr}.ah .cta .btn{width:100%}}
.ad{padding-block:30px 80px}.ad h1{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}.ad .lock{max-width:440px;margin:50px auto}
.dtabs{flex-wrap:wrap}.tw{overflow-x:auto}table{min-width:560px}td select,td button.sm{font:600 .85rem var(--body);padding:6px 10px;min-height:34px;border:2px solid var(--line);background:#fff;cursor:pointer;margin:2px}td button.sm.r{color:var(--red-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}.tiles div{background:var(--ink);color:#fff;padding:16px 18px}.tiles b{display:block;font:800 1.8rem var(--display)}.tiles span{color:#B7BEC9;font-size:.9rem}
.af{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}.af .w{grid-column:1/-1}.af label{font-weight:600;font-size:.88rem;display:block;margin-bottom:4px}.af input,.af select,.af textarea{width:100%;border:2px solid var(--line);padding:11px;font:400 1rem var(--body);min-height:46px;border-radius:0}
.badge{display:inline-block;padding:2px 9px;font-size:.78rem;font-weight:600;background:var(--mist)}.badge.p{background:#FFE3E5;color:var(--red-d)}.badge.ok{background:var(--ink);color:#fff}
@media(max-width:860px){.dtabs{flex-wrap:nowrap;overflow-x:auto}.dtabs button{flex:0 0 auto;white-space:nowrap}}.mut{color:var(--slate)}</style></head><body>
<header class="hdr is-stuck"><div class="wrap hdr__in"><a class="hdr__logo" href="index.html"><img src="images/geopram-logo.png" alt="Geopram Technologies" width="150" height="40"></a><nav class="nav" style="display:flex"><a href="index.html">Website</a><a href="academy.html">Academy</a><a href="marketplace.html">Marketplace</a><a href="forms/index.html">Forms</a></nav></div></header>
<main id="app"></main><div class="toast" id="toast" role="status"></div><script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),kes=n=>'KES '+(n||0).toLocaleString('en-KE');
const OWNERS=['info@geopramtech.co.ke','celestakim018@gmail.com'];
const SC=[['qgis','QGIS Essentials',3000],['gee','Google Earth Engine',5000],['rs','Remote Sensing Fundamentals',0],['map','Map Making and Cartography',2500],['ml','Machine Learning for Remote Sensing',6000],['dl','Deep Learning for Earth Observation',8000],['py','Python for GIS',4000],['sql','SQL Basics',0],['pg','PostgreSQL and PostGIS',4000],['web','Web Development: HTML and CSS',3500],['dep','Deployment and Hosting',3000],['stk','M-PESA STK Push Integration',5000]];
const SP=[['stk','M-PESA STK Push Starter Kit',6000],['otp','Gmail API OTP Mailer',3500],['lis','Parcel Search and PDF Portal',15000],['qgis','QGIS Map Layout Pack',1500],['gee','Earth Engine Script Bundle',2500],['poster','Research Poster and Map Templates',1200],['site','Business Website Template',4500],['bak','Google Sheets Backup Automation',2000],['clean','Cadastral Data Cleaning Toolkit',5000],['notes','GIS and Remote Sensing Study Notes',0],['sqlc','SQL and PostGIS Cheat Sheet',0]];
const ytid=s=>{s=(s||'').trim();const m=s.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(s)?s:''};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const users=()=>jget('gp_users',{}),ud=e=>jget('gp_d_'+e,{en:{},pay:[]}),orders=()=>jget('gp_orders',[]);
const hc=()=>jget('gp_hc',[]),hp=()=>jget('gp_hp',[]);
const CC=()=>[...SC.map(([id,t,p])=>({id,t,p,by:'Geopram Academy',st:1})),...jget('gp_courses',[]).map(c=>({id:c.id,t:c.t,p:c.p,by:c.by||c.o,cu:1}))];
const PP=()=>[...SP.map(([id,t,p])=>({id,t,p,by:'Geopram',st:1})),...jget('gp_prods',[]).map(p=>({id:p.id,t:p.t,p:p.p,by:p.by||'Admin',cu:1}))];
let tab='ov';const T=[['ov','Overview'],['us','Users'],['co','Courses'],['pr','Products'],['fm','Forms'],['pa','Payments'],['se','Settings']];
function pays(){const R=[];for(const [em,u] of Object.entries(users()))ud(em).pay.forEach(p=>R.push({d:p.date,w:u.n,em,w2:(CC().find(c=>c.id===p.id)||{t:p.id}).t,a:p.amt,rc:p.rc,s:'Academy'}));orders().forEach(o=>R.push({d:o.ts,w:o.em,em:o.em,w2:o.items.map(i=>i.t).join(', '),a:o.tot,rc:o.rc,s:'Marketplace'}));return R.sort((a,b)=>b.d-a.d)}
function boot(){const ad=jget('gp_adm',null),ss=jget('gp_adm_s',null);
 if(!ss){$('#app').innerHTML=`<div class="lock dl"><h1 style="font-size:1.8rem">${ad?'Admin login':'Set up admin'}</h1><p class="mut">${ad?'Sign in to manage Geopram.':'Create the admin password for this site.'}</p><form id="lf" style="display:grid;gap:14px" novalidate><div><label for="l1">Email</label><input id="l1" type="email" value="${ad?ad.em:OWNERS[0]}" ${ad?'readonly':''}></div><div><label for="l2">Password (8+ characters)</label><input id="l2" type="password" autocomplete="current-password"></div><div class="msg" id="lm" role="alert"></div><button class="btn btn--red" type="submit">${ad?'Log in':'Create admin'}</button></form><p class="mut">Prototype: this checks the password in the browser only. Move it to a server before going live.</p></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const em=$('#l1').value.trim().toLowerCase(),pw=$('#l2').value,h=await hash(pw);if(ad?em!==ad.em:!OWNERS.includes(em))return $('#lm').textContent='Use the owner email: '+OWNERS.join(' or ');if(pw.length<8)return $('#lm').textContent='Use at least 8 characters.';
   if(!ad)jset('gp_adm',{em,h});else if(ad.h!==h||ad.em!==em)return $('#lm').textContent='Email or password is incorrect.';jset('gp_adm_s',{em});boot()};return}
 $('#app').innerHTML=`<div class="wrap ad"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><h1>Admin dashboard</h1><span><a class="btn btn--line" href="forms/dashboard.html" style="min-height:44px">Forms studio</a> <a class="btn btn--line" href="academy.html#tutor" style="min-height:44px">Tutor portal</a> <button class="btn btn--ink" id="so" style="min-height:44px">Log out</button></span></div><div class="dtabs" id="dt" style="margin:18px 0"></div><div id="dv"></div></div>`;
 $('#so').onclick=()=>{jset('gp_adm_s',null);boot()};show(tab)}
function show(t){tab=t;$('#dt').innerHTML=T.map(([k,v])=>`<button data-t="${k}" aria-pressed="${k===t}">${v}</button>`).join('');
 const U=users(),ue=Object.entries(U),P=pays(),tw=h=>`<div class="tw">${h}</div>`;let h='';
 if(t==='ov'){const tut=ue.filter(([,u])=>u.role==='tutor'),pend=tut.filter(([,u])=>u.ap===0),en=ue.reduce((a,[e])=>a+Object.keys(ud(e).en).length,0),ra=P.filter(p=>p.s==='Academy').reduce((a,p)=>a+p.a,0),rm=P.filter(p=>p.s==='Marketplace').reduce((a,p)=>a+p.a,0);
  h=`<div class="tiles">${[[ue.length,'Users'],[tut.length,'Tutors'],[pend.length,'Awaiting approval'],[CC().length,'Courses'],[en,'Enrolments'],[kes(ra),'Academy sales'],[kes(rm),'Marketplace sales'],[(jget('geopramForms.v1',{forms:[]}).forms||[]).filter(f=>f.approval==='pending').length,'Forms awaiting approval']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>
  <h3>Tutor approvals</h3>${pend.length?tw(`<table>${pend.map(([e,u])=>`<tr><td>${esc(u.n)}<br><small class="mut">${esc(e)}</small></td><td><button class="sm" data-ap="${esc(e)}">Approve</button></td></tr>`).join('')}</table>`):'<p class="mut">No tutors are waiting.</p>'}
  <h3 style="margin-top:22px">Latest payments</h3>${P.length?tw(`<table>${P.slice(0,6).map(p=>`<tr><td>${new Date(p.d).toLocaleDateString('en-KE')}</td><td>${esc(p.s)}</td><td>${esc(p.w2)}</td><td>${kes(p.a)}</td></tr>`).join('')}</table>`):'<p class="mut">No payments yet.</p>'}`}
 if(t==='us')h=ue.length?tw(`<table><tr><th>User</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>${ue.map(([e,u])=>`<tr><td>${esc(u.n)}<br><small class="mut">${esc(e)} · ${esc(u.ph||'')}</small></td><td><select data-ro="${esc(e)}">${['learner','tutor'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td>${u.sus?'<span class="badge p">Suspended</span>':u.ap===0?'<span class="badge p">Pending</span>':'<span class="badge ok">Active</span>'}</td><td>${u.since?new Date(u.since).toLocaleDateString('en-KE'):'-'}</td><td>${u.ap===0?`<button class="sm" data-ap="${esc(e)}">Approve</button>`:''}<button class="sm" data-su="${esc(e)}">${u.sus?'Activate':'Suspend'}</button><button class="sm" data-rp="${esc(e)}">Reset password</button><button class="sm r" data-du="${esc(e)}">Delete</button></td></tr>`).join('')}</table>`):'<p>No registered users yet.</p>';
 if(t==='co'){const stu=id=>ue.filter(([e])=>ud(e).en[id]).length;
  h=tw(`<table><tr><th>Course</th><th>Tutor</th><th>Price</th><th>Students</th><th>Status</th><th>Actions</th></tr>${CC().map(c=>`<tr><td>${esc(c.t)}</td><td>${esc(c.by)}</td><td>${c.p?kes(c.p):'Free'}</td><td>${stu(c.id)}</td><td>${hc().includes(c.id)?'<span class="badge p">Hidden</span>':'<span class="badge ok">Live</span>'}</td><td><button class="sm" data-hc="${c.id}">${hc().includes(c.id)?'Show':'Hide'}</button>${c.cu?`<button class="sm r" data-dc="${c.id}">Delete</button>`:''}</td></tr>`).join('')}</table>`)+
